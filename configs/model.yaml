random_state: 42
target_quantiles:
  low: 0.50
  medium: 0.80
selection_metric: f1_macro
artifacts_dir: models
reports_dir: reports
mlflow:
  experiment: dengue-risk-classification
  tracking_uri: null
models:
  logistic_regression:
    max_iter: 1000
    C: 1.0
  random_forest:
    n_estimators: 150
    max_depth: 12
    min_samples_leaf: 3
    n_jobs: 2
  xgboost:
    n_estimators: 150
    max_depth: 4
    learning_rate: 0.08
    subsample: 0.9
    colsample_bytree: 0.9
    n_jobs: 2
tuning:
  enabled: false
  iterations: 4
  folds: 3